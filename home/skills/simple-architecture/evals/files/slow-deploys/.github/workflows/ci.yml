name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - name: Generate code
        run: go run github.com/example/protogen/cmd/protogen@v1.9.0 ./api/...
      - run: go test ./...

  deploy-staging:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and push
        run: |
          docker build -t registry.example.com/orders:staging .
          docker push registry.example.com/orders:staging
      - name: Deploy
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_ADMIN }}
        run: |
          echo "$KUBECONFIG_DATA" > kubeconfig
          kubectl --kubeconfig kubeconfig rollout restart deploy/orders
          kubectl --kubeconfig kubeconfig rollout status deploy/orders --timeout 5m
